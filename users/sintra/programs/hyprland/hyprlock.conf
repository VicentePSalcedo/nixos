# Hyprlock - TokyoNight Storm lock screen
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(26, 27, 38, 1.0)
}

input-field {
    monitor =
    size = 300, 60
    position = 0, -80
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(41, 46, 66, 1.0)
    inner_color = rgba(36, 40, 59, 1.0)
    font_color = rgba(192, 202, 245, 1.0)
    fade_on_empty = true
    placeholder_text = "<i>Password...</i>"
}

label {
    monitor =
    text = "$TIME"
    font_size = 64
    font_family = "sans-serif"
    color = rgba(192, 202, 245, 1.0)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%a %d %b"
    font_size = 18
    color = rgba(169, 177, 214, 1.0)
    position = 0, 40
    halign = center
    valign = center
}
